.chip,.preset{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:999px;padding:6px 11px;font:500 11px var(--mono);transition:.18s}

.seg button{border:0;background:transparent;padding:9px 4px;font:600 11px var(--mono);color:var(--muted);border-right:1px solid var(--line)}

let lang="az";try{const l=localStorage.getItem("lang");if(T[l])lang=l}catch(e){}
const t=(k,v)=>{let s=(T[lang]&&T[lang][k])||T.az[k]||k;if(v)for(const x in v)s=s.replace("{"+x+"}",v[x]);return s};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- state ---------- */
const DEFAULT=()=>({kcal:1200,protein:"any",counts:{Main:1,Snack:1,Drink:1,Dessert:0,Coffee:0,McCafe:0,Souse:0,Other:0},avoid:new Set()});
let S=DEFAULT(), last=null;
const $=id=>document.getElementById(id);

/* ---------- pools & generator (port of the Gradio logic) ---------- */
function pool(cat){
  let p=MENU.filter(m=>m.c===cat&&!m.a.some(a=>S.avoid.has(a)));
  if(cat==="Main"&&S.protein!=="any"){const f={meat:"m",chicken:"c",fish:"f"}[S.protein];p=p.filter(m=>m.p.includes(f))}
  return p;
}
function sample(arr,k){const a=arr.slice();for(let i=0;i<k;i++){const j=i+Math.floor(Math.random()*(a.length-i));const x=a[i];a[i]=a[j];a[j]=x}return a.slice(0,k)}
function generate(){
  const target=Math.round(Number(S.kcal));
  if(!(target>=200&&target<=6000))return {err:"e_kcal"};
  const used=CATS.filter(c=>S.counts[c]>0), total=used.reduce((n,c)=>n+S.counts[c],0);
  if(total<3)return {err:"e_min3",v:{n:total}};
  const pools={};let min=0,max=0;
  for(const c of used){
    const p=pool(c),need=S.counts[c];
    if(p.length<need)return {err:"e_pool",v:{cat:T[lang].cat[c],n:p.length,need}};
    const ks=p.map(m=>m.k).sort((a,b)=>a-b);
    min+=ks.slice(0,need).reduce((a,b)=>a+b,0);max+=ks.slice(-need).reduce((a,b)=>a+b,0);
    pools[c]=p;
  }
  if(target+TOL<min||target-TOL>max)return {err:"e_range",v:{min,max}};
  const found=[],seen=new Set();let att=0;
  while(found.length<WANT&&att<MAXTRY){
    att++;let menu=[];
    for(const c of used)menu=menu.concat(sample(pools[c],S.counts[c]));
    const sum=menu.reduce((n,m)=>n+m.k,0);
    if(Math.abs(sum-target)<=TOL){
      const key=menu.map(m=>m.id).sort((a,b)=>a-b).join("-");
      if(!seen.has(key)){seen.add(key);menu.sort((a,b)=>CATS.indexOf(a.c)-CATS.indexOf(b.c));found.push({items:menu,sum})}
    }
  }
  if(!found.length)return {err:"e_none",v:{att}};
  found.sort((a,b)=>Math.abs(a.sum-target)-Math.abs(b.sum-target));
  return {menus:found,att,target};
}

/* ---------- rendering ---------- */
function renderControls(){
  $("presets").innerHTML=PRESETS.map(p=>`<button class="preset${Number(S.kcal)===p?" on":""}" data-p="${p}">${p}</button>`).join("");
  $("protein").innerHTML=[["any","pAny"],["meat","pMeat"],["chicken","pChicken"],["fish","pFish"]].map(([v,k])=>`<button role="radio" aria-checked="${S.protein===v}" data-v="${v}">${esc(t(k))}</button>`).join("");
  $("cats").innerHTML=CATS.map(c=>{
    const n=S.counts[c],av=pool(c).length;
    return `<div class="cat${n>0?" active":""}"><div class="name">${esc(T[lang].cat[c])}<small>${esc(t("avail",{n:av}))}</small></div>
    <div class="step"><button data-c="${c}" data-d="-1" aria-label="− ${esc(T[lang].cat[c])}"${n<=0?" disabled":""}>−</button><output>${n}</output><button data-c="${c}" data-d="1" aria-label="+ ${esc(T[lang].cat[c])}"${n>=Math.min(6,av)?" disabled":""}>+</button></div></div>`}).join("");
  $("allergens").innerHTML=ALGS.map(a=>`<button class="chip" aria-pressed="${S.avoid.has(a)}" data-a="${a}">${esc(T[lang].alg[a])}</button>`).join("");
  const tot=CATS.reduce((n,c)=>n+S.counts[c],0);$("totalSel").textContent=t("selTotal",{n:tot});
}
function tile(m){
  const fb=esc(m.n.trim().charAt(0).toUpperCase());
  return `<div class="item"><div class="thumb"><span class="tag">${esc(T[lang].cat[m.c])}</span>${m.i?`<img src="img/${m.id}.webp" alt="${esc(m.n)}" loading="lazy" onerror="this.outerHTML='<span class=fallback>${fb}</span>'">`:`<span class="fallback">${fb}</span>`}</div>
  <div class="info"><b>${esc(m.n)}</b><span>${m.k} kcal</span></div></div>`;
}
function renderResults(){
  const el=$("results");
  if(!last){el.innerHTML="";return}
  if(last.err){el.innerHTML=`<div class="notice"><span class="ico">⚠️</span><p>${esc(t(last.err,last.v))}</p></div>`;return}
  el.innerHTML=`<div class="summary"><h2>${esc(t("found",{n:last.menus.length}))}</h2><span class="meta">${esc(t("meta",{att:last.att,k:last.target}))}</span></div>`+
  last.menus.map((m,i)=>{const d=m.sum-last.target;return `<article class="panel menu"><div class="menu-head"><span class="rank">0${i+1}</span><h3>${esc(t("menuN",{n:i+1}))}</h3><span class="delta">${d>0?"+":""}${d} kcal</span><span class="badge">${m.sum} kcal</span></div><div class="grid">${m.items.map(tile).join("")}</div></article>`}).join("");
}
function applyStatic(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(e=>{const k=e.dataset.i18n;if(T[lang][k]!==undefined||T.az[k]!==undefined)e.textContent=t(k)});
  document.querySelectorAll("#langs button").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
  renderControls();renderResults();
}
function run(){
  last=generate();renderResults();
  if(!run.tracked){run.tracked=1;track("demo/menu-generate","Menu demo: generate")}
}

/* ---------- events ---------- */
$("presets").addEventListener("click",e=>{const b=e.target.closest("[data-p]");if(!b)return;S.kcal=Number(b.dataset.p);$("kcal").value=S.kcal;renderControls()});
$("kcal").addEventListener("input",e=>{S.kcal=e.target.value;renderControls()});
$("kcal").addEventListener("keydown",e=>{if(e.key==="Enter")run()});
$("protein").addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(!b)return;S.protein=b.dataset.v;renderControls()});
$("cats").addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(!b||b.disabled)return;const c=b.dataset.c;S.counts[c]=Math.max(0,Math.min(6,S.counts[c]+Number(b.dataset.d)));renderControls()});
$("allergens").addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;S.avoid.has(a)?S.avoid.delete(a):S.avoid.add(a);
  /* keep counts valid against shrinking pools */
  for(const c of CATS){const av=pool(c).length;if(S.counts[c]>av)S.counts[c]=av}renderControls()});
$("gen").addEventListener("click",run);
$("reset").addEventListener("click",()=>{S=DEFAULT();$("kcal").value=S.kcal;renderControls();run()});
$("langs").addEventListener("click",e=>{const b=e.target.closest("[data-lang]");if(!b)return;lang=b.dataset.lang;try{localStorage.setItem("lang",lang)}catch(_){}applyStatic()});
const root=document.documentElement,themeBtn=$("theme");
function setTheme(v){root.dataset.theme=v;themeBtn.textContent=v==="light"?"☀":"☾";try{localStorage.setItem("theme",v)}catch(e){}document.querySelector('meta[name=theme-color]').content=v==="light"?"#f4f5f1":"#080a0d"}
themeBtn.onclick=()=>setTheme(root.dataset.theme==="light"?"dark":"light");
setTheme(root.dataset.theme==="light"?"light":"dark");
$("yr").textContent=new Date().getFullYear();
applyStatic();run();
</script>
